name: CI

on:
  push:
    branches: [ main, init ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

env:
  # tas-mcp's go.mod requires 1.24 (reduce-at-source pulls Gatekeeper's pkg/extract).
  GO_VERSION: '1.24'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # tas-mcp's go.mod replaces github.com/Tributary-ai-services/Gatekeeper with
    # ../Gatekeeper (reduce-at-source imports its pure-Go pkg/extract). Clone it
    # as a sibling of the checkout so the replace resolves. Public repo → no token.
    - name: Checkout Gatekeeper (local-replace dependency)
      run: git clone --depth 1 https://github.com/Tributary-ai-services/Gatekeeper.git ../Gatekeeper

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
      continue-on-error: true
          
    - name: Install system dependencies
      run: |
        # Install buf for protobuf generation
        sudo curl -sSL "https://github.com/bufbuild/buf/releases/latest/download/buf-$(uname -s)-$(uname -m)" -o /usr/local/bin/buf
        sudo chmod +x /usr/local/bin/buf
        
        # Install kustomize for k8s validation
        sudo curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Download dependencies
      run: make deps
      
    - name: Verify dependencies
      run: go mod verify
      
    - name: Install development tools
      run: make dev-deps
      
    - name: Generate proto files
      run: make proto
      
    - name: Check formatting
      run: make fmt-check
      
    - name: Run linter
      run: make lint
        
    - name: Run unit tests
      run: make test-unit
      
    - name: Run integration tests
      run: make test-integration
      
    - name: Generate coverage report
      run: make test-coverage
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    - name: Validate Kubernetes manifests
      run: make k8s-validate

    - name: Validate MCP registry
      run: |
        cd registry
        npm ci --silent
        npm run validate
        
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # tas-mcp's go.mod replaces github.com/Tributary-ai-services/Gatekeeper with
    # ../Gatekeeper (reduce-at-source imports its pure-Go pkg/extract). Clone it
    # as a sibling of the checkout so the replace resolves. Public repo → no token.
    - name: Checkout Gatekeeper (local-replace dependency)
      run: git clone --depth 1 https://github.com/Tributary-ai-services/Gatekeeper.git ../Gatekeeper

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
      continue-on-error: true
          
    - name: Install system dependencies
      run: |
        # Install buf for protobuf generation
        sudo curl -sSL "https://github.com/bufbuild/buf/releases/latest/download/buf-$(uname -s)-$(uname -m)" -o /usr/local/bin/buf
        sudo chmod +x /usr/local/bin/buf

    - name: Download dependencies
      run: make deps
      
    - name: Install development tools
      run: make dev-deps
      
    - name: Generate proto files
      run: make proto
      
    - name: Run benchmarks
      run: make test-benchmark
      
  build:
    name: Build and Docker
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # tas-mcp's go.mod replaces github.com/Tributary-ai-services/Gatekeeper with
    # ../Gatekeeper (reduce-at-source imports its pure-Go pkg/extract). Clone it
    # as a sibling of the checkout so the replace resolves. Public repo → no token.
    - name: Checkout Gatekeeper (local-replace dependency)
      run: git clone --depth 1 https://github.com/Tributary-ai-services/Gatekeeper.git ../Gatekeeper

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
      continue-on-error: true

    - name: Install system dependencies
      run: |
        # Install buf for protobuf generation
        sudo curl -sSL "https://github.com/bufbuild/buf/releases/latest/download/buf-$(uname -s)-$(uname -m)" -o /usr/local/bin/buf
        sudo chmod +x /usr/local/bin/buf
          
    - name: Download dependencies
      run: make deps
      
    - name: Install development tools
      run: make dev-deps
      
    - name: Generate proto files
      run: make proto
      
    - name: Build binary
      run: make build
      
    - name: Build Docker image
      # The Dockerfile builds from the monorepo-root context so the ../Gatekeeper
      # replace resolves. In CI the checkout's parent holds tas-mcp/ + the cloned
      # Gatekeeper/, so use it as the build context.
      run: docker build -f Dockerfile -t tas-mcp:latest ..

    - name: Test Docker image
      run: |
        # Start the container in the background for health check
        docker run -d --name test-container -p 8080:8080 -p 50051:50051 -p 8082:8082 tas-mcp:latest
        
        # Wait for container to start
        sleep 10
        
        # Check if container is running
        docker ps | grep test-container
        
        # Test health endpoint (with retry)
        for i in {1..30}; do
          if curl -f http://localhost:8082/health; then
            echo "Health check passed"
            break
          fi
          echo "Health check attempt $i failed, retrying in 2s..."
          sleep 2
        done
        
        # Clean up
        docker stop test-container
        docker rm test-container
        
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout Gatekeeper (local-replace dependency)
      run: git clone --depth 1 https://github.com/Tributary-ai-services/Gatekeeper.git ../Gatekeeper

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install Gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run Gosec Security Scanner
      run: |
        timeout 120s gosec -no-fail -fmt sarif -out gosec.sarif -exclude-dir=gen -exclude-dir=proto/gen ./... || echo "Gosec completed with issues or timed out"
        # Ensure SARIF file exists, create empty one if not
        if [ ! -f gosec.sarif ]; then
          echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[]}' > gosec.sarif
        fi
      continue-on-error: true

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: gosec.sarif
      continue-on-error: true

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
      continue-on-error: true
      
    - name: Build Docker image for security scan
      # Root-context build (needs the Gatekeeper sibling); parent holds
      # tas-mcp/ + the cloned Gatekeeper/ in CI.
      run: docker build -f Dockerfile -t tas-mcp:security-test ..
      continue-on-error: true

    - name: Run Trivy vulnerability scanner on Docker image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'tas-mcp:security-test'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
      continue-on-error: true