apiVersion: v1
kind: Service
metadata:
  name: tas-mcp-http
  namespace: tas-mcp
  labels:
    app: tas-mcp
    service: http
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8082
    targetPort: http
    protocol: TCP
  selector:
    app: tas-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: tas-mcp-grpc
  namespace: tas-mcp
  labels:
    app: tas-mcp
    service: grpc
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 50052
    targetPort: grpc
    protocol: TCP
  selector:
    app: tas-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: tas-mcp-health
  namespace: tas-mcp
  labels:
    app: tas-mcp
    service: health
spec:
  type: ClusterIP
  ports:
  - name: health
    port: 8083
    targetPort: health
    protocol: TCP
  selector:
    app: tas-mcp
---
# AIQG-88: delegated tool invoke only (aether-be). Admitted by the
# NetworkPolicy from aether-backend pods only. The listener starts only with
# MCP_DELEGATION_ENABLED; until then the port refuses connections.
apiVersion: v1
kind: Service
metadata:
  name: tas-mcp-delegated
  namespace: tas-mcp
  labels:
    app: tas-mcp
    service: delegated
spec:
  type: ClusterIP
  ports:
  - name: delegated
    port: 8086
    targetPort: delegated
    protocol: TCP
  selector:
    app: tas-mcp
