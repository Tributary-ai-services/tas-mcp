apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tas-mcp-netpol
  namespace: tas-mcp
spec:
  podSelector:
    matchLabels:
      app: tas-mcp
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow HTTP traffic
  - ports:
    - protocol: TCP
      port: 8080
  # Allow gRPC traffic
  - ports:
    - protocol: TCP
      port: 50051
  # Allow health checks from monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8082
  # Allow health checks from kube-system (kubelet)
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 8082
  # The MCP servers reach the federation API on 8082. Patched into the live
  # policy by hand on 2026-02-06 and never committed; carried here so that
  # applying this tree does not cut them off.
  - from:
    - namespaceSelector:
        matchLabels:
          name: tas-mcp-servers
    ports:
    - protocol: TCP
      port: 8082
  # Also patched in on 2026-02-06: 8082 from any source. It makes the three
  # rules above redundant; kept as-is so this commit changes nothing live.
  # Narrowing it is a separate decision.
  - ports:
    - protocol: TCP
      port: 8082
  egress:
  # Allow DNS resolution
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS for forwarding (if configured)
  - ports:
    - protocol: TCP
      port: 443
  # Allow HTTP for forwarding (if configured)
  - ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080