apiVersion: v1
kind: ConfigMap
metadata:
  name: tas-mcp-config
  namespace: tas-mcp
data:
  LOG_LEVEL: "info"
  HTTP_PORT: "8082"
  GRPC_PORT: "50052"
  HEALTH_CHECK_PORT: "8083"
  BUFFER_SIZE: "1000"
  MAX_CONNECTIONS: "100"
  MAX_EVENT_SIZE: "1048576"  # 1MB
  FORWARD_TIMEOUT: "30s"
  # Plan #22 T.1: resolve the caller's TAS-Auth token through aiqg-dashboard-be
  # (observe mode: a call without a valid token is still served, unattributed).
  IDENTITY_ENABLED: "true"
  AIQG_DASHBOARD_URL: "http://aiqg-dashboard-be.aiqg.svc.cluster.local:8095"
  # Plan #22 T.2: one com.tas.aiqg.tool_call.v1 per call, to the topic the
  # aiqg-aggregator reads (Timescale aiqg.tool_call_events).
  TOOL_CALL_EVENTS_ENABLED: "true"
  AIQG_KAFKA_BROKERS: "kafka-shared.tas-shared:9092"
  AIQG_KAFKA_TOPIC: "tas.aiqg.events.v1"
  # Plan #22 T.4: probe every federated server each 60 s (tas_mcp_server_up),
  # and snapshot each server's tools/list as com.tas.aiqg.tool_catalogue.v1.
  SERVER_PROBES_ENABLED: "true"
  TOOL_CATALOGUE_EVENTS_ENABLED: "true"
  # Plan #22 T.3 (GK-5b): attest scanned tool results into the gateway's
  # scan-once store. The key carries the gateway's build, which the proxy
  # cannot learn (AIQG-85): this must follow every gateway roll, or the
  # gateway simply scans again (fails safe).
  SCAN_ATTEST_ENABLED: "true"
  SCAN_ATTEST_GATEWAY_BUILDS: "5.120.0"
  # Plan #22 C.1: tenant-scoped registry. Writes need TAS-MCP-Admin-Token
  # (operator 0.4.0 and the dashboard reconcile send it); each caller sees
  # platform servers plus its own tenant's, by the resolved token only.
  MCP_TENANT_SERVERS: "true"
  # Plan #22 C.4: per-tenant connection injection. On each tools/call by an
  # attributed caller the proxy resolves that tenant's stored connection from
  # aiqg-dashboard-be (/internal/mcp/connections/resolve, token in Secret
  # mcp-connections-resolve-token) and injects it; cached 60 s.
  # postgres-mcp, not dbhub: dbhub is stock bytebase/dbhub with its DSN in its
  # own config and never reads _connection; postgres-mcp runs the TAS bridge,
  # which takes _connection per call (what aether-be injects today) and keys
  # its sessions by tenant + full connection (SEC-37). Egress: in-cluster
  # hosts in tas-mcp-servers, plus MCP_DSN_EGRESS_ALLOW below; no external
  # hosts (MCP_TENANT_EGRESS_ALLOWLIST unset).
  MCP_CONNECTION_INJECTION: "true"
  MCP_CONNECTION_SERVERS: "postgres-mcp=database_dsn"
  # MCP-19: the exact host:port pairs any tenant's stored DSN may name, so a
  # TAS org's database on the shared PostgreSQL is reachable without opening
  # the rest of tas-shared (Redis, Keycloak, Kafka, MinIO stay refused). Read
  # by the first tas-mcp release with MCP-19 (1.7.0 ignores it). The SAME value must be set on
  # aiqg-dashboard-be (k8s/configmap.yaml) and on postgres-mcp
  # (tas-mcp-servers k8s/postgres-mcp/deployment.yaml), or a connection AIQG
  # accepts is refused here (or the reverse). Comma-separated; each entry needs
  # a port; one bad entry disables the whole list. docs/TENANT_SERVERS.md
  # "DSN egress".
  MCP_DSN_EGRESS_ALLOW: "postgres-shared.tas-shared.svc.cluster.local:5432"
  # SEC-38: postgres-mcp never runs a call on its own login through the proxy.
  # No stored connection = 403; tools/list stays open; broadcast skips it.
  MCP_CONNECTION_REQUIRED_SERVERS: "postgres-mcp"
