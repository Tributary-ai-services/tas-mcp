apiVersion: v1
kind: ConfigMap
metadata:
  name: tas-mcp-config
  namespace: tas-mcp
data:
  LOG_LEVEL: "info"
  HTTP_PORT: "8082"
  GRPC_PORT: "50052"
  HEALTH_CHECK_PORT: "8083"
  BUFFER_SIZE: "1000"
  MAX_CONNECTIONS: "100"
  MAX_EVENT_SIZE: "1048576"  # 1MB
  FORWARD_TIMEOUT: "30s"
  # Plan #22 T.1: resolve the caller's TAS-Auth token through aiqg-dashboard-be
  # (observe mode: a call without a valid token is still served, unattributed).
  IDENTITY_ENABLED: "true"
  AIQG_DASHBOARD_URL: "http://aiqg-dashboard-be.aiqg.svc.cluster.local:8095"
  # Plan #22 T.2: one com.tas.aiqg.tool_call.v1 per call, to the topic the
  # aiqg-aggregator reads (Timescale aiqg.tool_call_events).
  TOOL_CALL_EVENTS_ENABLED: "true"
  AIQG_KAFKA_BROKERS: "kafka-shared.tas-shared:9092"
  AIQG_KAFKA_TOPIC: "tas.aiqg.events.v1"
  # Plan #22 T.4: probe every federated server each 60 s (tas_mcp_server_up),
  # and snapshot each server's tools/list as com.tas.aiqg.tool_catalogue.v1.
  SERVER_PROBES_ENABLED: "true"
  TOOL_CATALOGUE_EVENTS_ENABLED: "true"
  # Plan #22 T.3 (GK-5b): attest scanned tool results into the gateway's
  # scan-once store. The key carries the gateway's build, which the proxy
  # cannot learn (AIQG-85): this must follow every gateway roll, or the
  # gateway simply scans again (fails safe).
  SCAN_ATTEST_ENABLED: "true"
  SCAN_ATTEST_GATEWAY_BUILDS: "5.120.0"