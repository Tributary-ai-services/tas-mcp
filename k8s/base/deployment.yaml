apiVersion: apps/v1
kind: Deployment
metadata:
  name: tas-mcp
  namespace: tas-mcp
  labels:
    app: tas-mcp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: tas-mcp
  template:
    metadata:
      labels:
        app: tas-mcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tas-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: tas-mcp
        image: registry-api.tas.scharber.com/tas-mcp:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8082
          protocol: TCP
        - name: grpc
          containerPort: 50052
          protocol: TCP
        - name: health
          containerPort: 8083
          protocol: TCP
        env:
        - name: VERSION
          value: "1.0.0"
        # Federation registry store. This was applied straight to the cluster
        # and had never been in this manifest, so `kubectl apply -k` would
        # have dropped it and sent the federation registry back to in-memory.
        #
        # redis-shared requires a password since 2026-09-18 (SEC-24). It comes
        # from the Secret and is interpolated here; REDIS_PASSWORD must be
        # declared before FEDERATION_REDIS_URL, since $(VAR) expansion only
        # sees variables defined earlier in the same env list.
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-shared-auth
              key: password
        - name: FEDERATION_REGISTRY
          value: "redis"
        - name: FEDERATION_REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-shared.tas-shared.svc.cluster.local:6379/0"
        envFrom:
        - configMapRef:
            name: tas-mcp-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tas-mcp
  namespace: tas-mcp
  labels:
    app: tas-mcp