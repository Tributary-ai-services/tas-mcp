apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tas-mcp-prod

resources:
  - ../../base
  - hpa.yaml

namePrefix: prod-

commonLabels:
  environment: production

replicas:
  - name: tas-mcp
    count: 5

# Optional, needs CRDs this cluster lacks (see each component):
# components:
#   - ../../components/prometheus-operator
#   - vpa
#
# No Ingress: production has none. The one listed here until 2026-11-19 named
# api/grpc.tas-mcp.com with letsencrypt-prod, a domain this cluster does not
# serve; applying it would have published the proxy and sent cert-manager
# after a certificate it cannot get.

images:
  # The base image reference is the full registry path, so the old
  # `name: tas-mcp` entry never matched and prod rendered `:latest`.
  # 1.2.0 (MCP-16) replaces obs-20260817 (digest sha256:e2dffe1a...),
  # a bare date tag with no revision label.
  # 1.3.0 (Plan #22 T.1/T.2, #36/#37): caller identity and tool-call events.
  # 1.4.0 (T.4 #40 server probes + tool catalogue events, T.3 #41 scan
  # attestations), all behind flags that default off. Pinned by digest.
  # 1.5.0 (P4-Config C.1, #44): tenant-scoped registry behind
  # MCP_TENANT_SERVERS (off here until C.3 exists).
  # 1.6.0 (P4-Config C.4, #46): per-tenant connection injection behind
  # MCP_CONNECTION_INJECTION (off).
  # 1.7.0 (SEC-38, #50): MCP_CONNECTION_REQUIRED_SERVERS, on for postgres-mcp.
  # 1.8.0 (#52 delegate credential, MCP_DELEGATION_ENABLED unset = off; #53
  # MCP-19 DSN egress by host:port, MCP_DSN_EGRESS_ALLOW in base). Built from
  # 85b18b9 with Gatekeeper 8439cfe, Hyperscan linked.
  - name: registry-api.tas.scharber.com/tas-mcp
    newTag: 1.8.0
    digest: sha256:f299a6626d4f653c8d87ccbfe9fce384d607b3f194e47dcd59c71e6dc546ba70
