apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tas-mcp-hpa
  namespace: tas-mcp-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prod-tas-mcp
  minReplicas: 5
  maxReplicas: 50
  # CPU and memory only. A third Pods metric, tas_mcp_active_connections,
  # needed a custom.metrics.k8s.io adapter (prometheus-adapter) that this
  # cluster has never run, so every evaluation failed, ScalingActive stayed
  # False, and the HPA could scale up but never down. Re-add it together
  # with the adapter, not before.
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 5
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
      - type: Pods
        value: 10
        periodSeconds: 60