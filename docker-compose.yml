version: '3.8'

services:
  tas-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tas-mcp-server
    ports:
      - "8082:8082"   # HTTP API
      - "50052:50052" # gRPC
      - "8083:8083"   # Health check
    environment:
      - LOG_LEVEL=info
      - HTTP_PORT=8082
      - GRPC_PORT=50052
      - HEALTH_CHECK_PORT=8083
      - FORWARDING_ENABLED=true
      - FORWARDING_WORKERS=5
      - FORWARDING_BUFFER_SIZE=1000
    volumes:
      - ./configs:/configs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tas-shared-network


networks:
  tas-shared-network:
    external: true