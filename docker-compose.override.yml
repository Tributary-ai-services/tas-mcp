# Docker Compose override for development
# This file extends docker-compose.yml for local development

version: '3.8'

services:
  tas-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Stop at builder stage for development
    volumes:
      - .:/app
      - /app/bin  # Prevent overwriting built binary
    environment:
      - LOG_LEVEL=debug
      - FORWARDING_ENABLED=true
      - FORWARDING_WORKERS=2
    command: ["go", "run", "./cmd/server"]
    ports:
      - "8082:8082"
      - "50052:50052"
      - "8083:8083"
      - "40000:40000"  # Delve debugger port

# All other services (redis, kafka, zookeeper, prometheus, grafana) 
# are provided by the shared infrastructure